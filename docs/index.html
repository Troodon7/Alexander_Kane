    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* ========== Animated Background Shapes ========== */
        .bg-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-shapes span {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            animation: float linear infinite;
        }

        .bg-shapes span:nth-child(1) {
            width: 400px; height: 400px;
            background: #0ea5e9;
            top: -10%; left: -5%;
            animation-duration: 25s;
        }
        .bg-shapes span:nth-child(2) {
            width: 350px; height: 350px;
            background: #6366f1;
            top: 60%; right: -10%;
            animation-duration: 30s;
            animation-delay: -5s;
        }
        .bg-shapes span:nth-child(3) {
            width: 300px; height: 300px;
            background: #8b5cf6;
            bottom: -15%; left: 30%;
            animation-duration: 20s;
            animation-delay: -10s;
        }
        .bg-shapes span:nth-child(4) {
            width: 250px; height: 250px;
            background: #0ea5e9;
            top: 30%; right: 20%;
            animation-duration: 28s;
            animation-delay: -3s;
        }
        .bg-shapes span:nth-child(5) {
            width: 200px; height: 200px;
            background: #6366f1;
            top: 10%; left: 50%;
            animation-duration: 22s;
            animation-delay: -8s;
        }
        .bg-shapes span:nth-child(6) {
            width: 280px; height: 280px;
            background: #8b5cf6;
            bottom: 20%; left: -8%;
            animation-duration: 26s;
            animation-delay: -15s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(40px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(30px, 40px) scale(1.02); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bg-shapes span { animation: none; }
        }

        /* ========== Skill Bubbles ========== */
        .skill-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .skill-bubble {
            position: absolute;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            color: rgba(148, 163, 184, 0.35);
            border: 1px solid rgba(148, 163, 184, 0.1);
            white-space: nowrap;
            user-select: none;
            will-change: transform;
        }

        /* ========== Card ========== */
        .card {
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline {
            font-size: 1.15rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .links a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 320px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #e2e8f0;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .links a:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #0ea5e9;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.15);
        }

        .links a svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* ========== Page Transition ========== */
        body {
            animation: pageIn 0.5s ease-out;
        }

        @keyframes pageIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        @media (max-width: 480px) {
            h1 { font-size: 2.5rem; }
            .tagline { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <!-- If you're reading this, you think like I do. Try a page thats not found for a real hint. -->

    <div class="card">

                LinkedIn

        </nav>

    <script>
        // === Floating Skill Bubbles with Physics ===
        // Add or remove skills here to update the background bubbles
        const skills = [
            "Security Monitoring", "EDR", "IAM", "FortiGate", "Active Directory",
            "AWS", "Windows Server", "VMware", "Linux", "Entra ID",
            "Microsoft 365", "SharePoint", "Cisco", "VPN", "Ubiquiti",
            "Python", "PowerShell", "Bash", "Kaseya RMM", "Networking",
            "Cloud Infrastructure", "Automation", "Technical Communication"
        ];

        const container = document.getElementById('skillBubbles');
        const bubbles = [];
        const speed = 0.3;

        // Place bubbles in a grid pattern for even spread, then jitter
        const cols = Math.ceil(Math.sqrt(skills.length * (window.innerWidth / window.innerHeight)));
        const rows = Math.ceil(skills.length / cols);

        skills.forEach((skill, i) => {
            const el = document.createElement('span');
            el.className = 'skill-bubble';
            el.textContent = skill;
            container.appendChild(el);

            const col = i % cols;
            const row = Math.floor(i / cols);
            const cellW = window.innerWidth / cols;
            const cellH = window.innerHeight / rows;

            const b = {
                el: el,
                x: cellW * col + cellW * (0.2 + Math.random() * 0.6),
                y: cellH * row + cellH * (0.2 + Math.random() * 0.6),
                vx: (Math.random() - 0.5) * speed * 2,
                vy: (Math.random() - 0.5) * speed * 2,
                w: 0, h: 0
            };
            bubbles.push(b);
        });

        // Measure sizes after DOM paint
        requestAnimationFrame(() => {
            bubbles.forEach(b => {
                const rect = b.el.getBoundingClientRect();
                b.w = rect.width;
                b.h = rect.height;
            });
        });

        // Respect prefers-reduced-motion
        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (!prefersReduced) {
            function animate() {
                const W = window.innerWidth;
                const H = window.innerHeight;

                for (let i = 0; i < bubbles.length; i++) {
                    const a = bubbles[i];
                    a.x += a.vx;
                    a.y += a.vy;

                    // Bounce off walls
                    if (a.x < 0) { a.x = 0; a.vx *= -1; }
                    if (a.y < 0) { a.y = 0; a.vy *= -1; }
                    if (a.x + a.w > W) { a.x = W - a.w; a.vx *= -1; }
                    if (a.y + a.h > H) { a.y = H - a.h; a.vy *= -1; }

                    // Bounce off other bubbles
                    for (let j = i + 1; j < bubbles.length; j++) {
                        const b = bubbles[j];
                        const dx = (a.x + a.w / 2) - (b.x + b.w / 2);
                        const dy = (a.y + a.h / 2) - (b.y + b.h / 2);
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const minDist = (a.w + b.w) / 2 + 8;

                        if (dist < minDist && dist > 0) {
                            const nx = dx / dist;
                            const ny = dy / dist;
                            const overlap = minDist - dist;

                            // Push apart
                            a.x += nx * overlap * 0.5;
                            a.y += ny * overlap * 0.5;
                            b.x -= nx * overlap * 0.5;
                            b.y -= ny * overlap * 0.5;

                            // Swap velocity components along collision axis
                            const aVn = a.vx * nx + a.vy * ny;
                            const bVn = b.vx * nx + b.vy * ny;
                            a.vx += (bVn - aVn) * nx;
                            a.vy += (bVn - aVn) * ny;
                            b.vx += (aVn - bVn) * nx;
                            b.vy += (aVn - bVn) * ny;
                        }
                    }

                    a.el.style.transform = 'translate(' + a.x + 'px,' + a.y + 'px)';
                }

                requestAnimationFrame(animate);
            }
            animate();
        } else {
            // Static placement for reduced motion
            bubbles.forEach(b => {
                b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px)';
            });
        }

        // === Smooth Page Transition ===
        document.getElementById('resumeLink').addEventListener('click', function(e) {
            e.preventDefault();
            const href = this.href;
            document.body.classList.add('fade-out');
            setTimeout(function() { window.location.href = href; }, 400);
        });
    </script>
